stages:
  - validate
  - deploy

# The validate stage runs the Node.js test and build suite
validate_and_test:
  stage: validate
  image: node:22
  script:
    - npm ci
    - npm run test:server
    - npm run test:client
    - npm run build:server
    - npm run build:client
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "development" || $CI_COMMIT_BRANCH =~ /^release\//'
    - if: '$CI_PIPELINE_SOURCE == "web"'

# The deploy stage handles Docker builds and Kubernetes/OpenShift deployment
deploy_to_cluster:
  stage: deploy
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    # Install kubectl inside the docker image for the deployment commands
    - apk add --no-cache curl bash
    - curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
    - chmod +x kubectl
    - mv kubectl /usr/local/bin/
  script:
    - |
      # 1. Determine Target Environment
      if [ "$CI_PIPELINE_SOURCE" = "web" ] && [ -n "$ENVIRONMENT_INPUT" ]; then
        TARGET="$ENVIRONMENT_INPUT"
      elif [ "$CI_COMMIT_BRANCH" = "main" ] || [[ "$CI_COMMIT_TAG" =~ ^v[0-9] ]]; then
        TARGET="prod"
      elif [[ "$CI_COMMIT_BRANCH" =~ ^release/ ]]; then
        TARGET="preprod"
      elif [ "$CI_COMMIT_BRANCH" = "development" ]; then
        TARGET="nonprod"
      else
        TARGET="nonprod"
      fi
      echo "Target deployment environment resolved to: $TARGET"

      # 2. Namespace resolution using GitLab Variables
      if [ "$TARGET" = "prod" ]; then
        K8S_NAMESPACE="$PROD_NAMESPACE"
      elif [ "$TARGET" = "preprod" ]; then
        K8S_NAMESPACE="$PREPROD_NAMESPACE"
      else
        K8S_NAMESPACE="$NONPROD_NAMESPACE"
      fi

      # 3. Set Image Metadata
      IMAGE_REGISTRY="${OPENSHIFT_REGISTRY:-image-registry.openshift-image-registry.svc:5000}"
      IMAGE_NAME="${IMAGE_REGISTRY}/${K8S_NAMESPACE}/hunting-lodge-app-${TARGET}"
      SHA_TAG="${TARGET}-${CI_COMMIT_SHORT_SHA}"

      # 4. Build Docker Container
      docker build \
        --build-arg VITE_APP_ENV=$TARGET \
        --build-arg VITE_APP_VERSION=$CI_COMMIT_REF_NAME \
        -t $IMAGE_NAME:$SHA_TAG \
        -t $IMAGE_NAME:latest \
        .

      # 5. Login to Cluster Registry and Push
      if [ -n "$OPENSHIFT_TOKEN" ]; then
        echo "$OPENSHIFT_TOKEN" | docker login "${OPENSHIFT_SERVER:-openshift.default.svc}" -u "${OPENSHIFT_USER:-serviceaccount}" --password-stdin
        docker push $IMAGE_NAME:$SHA_TAG
        docker push $IMAGE_NAME:latest
      fi

      # 6. Authenticate and Deploy to Kubernetes / OpenShift
      if [ -n "$KUBECONFIG_DATA" ]; then
        mkdir -p ~/.kube
        echo "$KUBECONFIG_DATA" | base64 -d > ~/.kube/config
        kubectl apply -f k8s/${TARGET}-deployment.yaml -n $K8S_NAMESPACE
        kubectl rollout status deployment/hunting-lodge-app-${TARGET} -n $K8S_NAMESPACE --timeout=300s
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "development" || $CI_COMMIT_BRANCH =~ /^release\//'
    - if: '$CI_PIPELINE_SOURCE == "web"'
