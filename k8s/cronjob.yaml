apiVersion: batch/v1
kind: CronJob
metadata:
  name: shift-report-cronjob
  # <YOUR_NAMESPACE>: change to the current namespace
  namespace: <YOUR_NAMESPACE>
  labels:
    app.kubernetes.io/name: shift-report-cronjob
    app.kubernetes.io/part-of: <YOUR_NAMESPACE>
    app.kubernetes.io/component: cron
    environment: <YOUR_ENV>
spec:
  # Run every minute in Asia/Jerusalem time
  schedule: "* * * * *"
  timeZone: "Asia/Jerusalem"
  startingDeadlineSeconds: 60
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app.kubernetes.io/name: shift-report-cronjob
            app.kubernetes.io/component: cron
            environment: <YOUR_ENV>
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: shift-report-worker
              # <YOUR_NAMESPACE>: change to the current namespace
              # <YOUR_DEPLOYMENT>: change to the current deployment
              image: image-registry.openshift-image-registry.svc:5000/<YOUR_NAMESPACE>/<YOUR_DEPLOYMENT>:latest
              imagePullPolicy: Always
              command:
                ["dumb-init", "--", "node", "src/scripts/runShiftReportCron.js"]
              # Container-level security context compliant with OpenShift restricted-v2 SCC
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              envFrom:
                - secretRef:
                    name: backend-secrets-<YOUR_ENV>
                - configMapRef:
                    name: backend-config-<YOUR_ENV>
