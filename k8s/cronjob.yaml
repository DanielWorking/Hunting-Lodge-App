# Placeholders, substituted by the CI deploy job (see README for a manual apply):
#   <NAMESPACE>                   target namespace
#   <ENV>                         nonprod, preprod or prod
#   <SHIFT_REPORT_CRON_SCHEDULE>  SHIFT_REPORT_CRON_SCHEDULE from the backend-config-<ENV> ConfigMap
apiVersion: batch/v1
kind: CronJob
metadata:
  name: shift-report-cronjob
  namespace: <NAMESPACE>
  labels:
    app.kubernetes.io/name: shift-report-cronjob
    app.kubernetes.io/part-of: <NAMESPACE>
    app.kubernetes.io/component: cron
    environment: <ENV>
spec:
  # Interpreted in Asia/Jerusalem time
  schedule: "<SHIFT_REPORT_CRON_SCHEDULE>"
  timeZone: "Asia/Jerusalem"
  startingDeadlineSeconds: 60
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app.kubernetes.io/name: shift-report-cronjob
            app.kubernetes.io/component: cron
            environment: <ENV>
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: shift-report-worker
              image: image-registry.openshift-image-registry.svc:5000/<NAMESPACE>/hunting-lodge-app-<ENV>:latest
              imagePullPolicy: Always
              command:
                ["dumb-init", "--", "node", "src/scripts/runShiftReportCron.js"]
              # Container-level security context compliant with OpenShift restricted-v2 SCC
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              envFrom:
                - secretRef:
                    name: backend-secrets-<ENV>
                - configMapRef:
                    name: backend-config-<ENV>
