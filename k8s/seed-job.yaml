apiVersion: batch/v1
kind: Job
metadata:
  name: mongodb-seed-job
  # <YOUR_NAMESPACE>: change to the current namespace
  namespace: <YOUR_NAMESPACE>
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: seeder
          # <YOUR_NAMESPACE>: change to the current namespace
          # <YOUR_DEPLOYMENT>: change to the current deployment
          image: image-registry.openshift-image-registry.svc:5000/<YOUR_NAMESPACE>/<YOUR_DEPLOYMENT>:latest
          # --idempotent: seeds only an unseeded database and never wipes, so it is safe in every environment
          command: ["node", "src/scripts/seed.js", "--idempotent"]
          envFrom:
            # <YOUR_ENV>: change to the target environment (nonprod, preprod or prod)
            - configMapRef:
                name: backend-config-<YOUR_ENV>
            - secretRef:
                name: backend-secrets-<YOUR_ENV>
